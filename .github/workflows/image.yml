# Build the API image and push it to GitHub's registry (ghcr.io), tagged <table_version>-<git commit>.
# Render deploys that image. Rolling back a bad week = deploying last week's tag.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions): DAGSHUB_USER and DAGSHUB_TOKEN,
# only to `dvc pull` the serving files (they're DVC outputs, not in Git). The test workflow (ci.yml) needs none.
name: Build API image

on:
  workflow_dispatch:                 # a "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:                           # only when something the image contains has changed
      - dvc.lock                     # a new weekly table
      - app/**
      - src/recsys/utils/shared.py
      - Dockerfile
      - requirements-serve.txt

permissions:
  contents: read
  packages: write                    # lets GITHUB_TOKEN push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pull ONLY the recommendation table from DagsHub
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # A wrong or missing login makes DagsHub say "not authorised", which DVC reports as "missing cache files".
          # So check the secrets first and fail with a CLEAR message.
          if [ -z "$DAGSHUB_USER" ] || [ -z "$DAGSHUB_TOKEN" ]; then
            echo "::error::Repository secrets DAGSHUB_USER and/or DAGSHUB_TOKEN are not set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          pip install dvc==3.67.1
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull table

      - name: Read the table version (the image tag)
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('artifacts/recommendation_table/serving/serving_manifest.json'))['table_version'][:12])")
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Table version: $VERSION"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (tagged with the table version, and latest)
        run: |
          # Tag = table version + code version (the git commit), so a CODE change with the same weekly table gets a
          # NEW tag instead of overwriting the old one: every tag ever deployed stays available for rollback.
          IMAGE=ghcr.io/${{ github.repository_owner }}/recsys-api
          TAG="${{ steps.version.outputs.tag }}-${GITHUB_SHA::7}"
          echo "Image tag: $TAG"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Tell Render to deploy the new image (no manual tag change)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Render's service points at :latest; its secret Deploy Hook URL makes it pull and deploy the new image.
          # Rollback: Render -> Events -> Rollback on an earlier deploy (each image also keeps its own tag).
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret: skipping the automatic deploy (deploy by hand in Render)"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy started"
