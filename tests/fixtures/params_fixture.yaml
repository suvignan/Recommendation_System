# params.yaml for the tiny fixture (tests/fixtures/raw), used by the smoke test and CI.
# The smoke test checks the PLUMBING (every stage runs and hands correct files to the next), not the QUALITY:
# on 20 customers recall is pure noise. Quality is what the real-data gate is for.
# Same structure as params.yaml; only the values marked "fixture" differ.

window:
  weeks: 12
  start_date: "2020-07-01"

dedup:
  key_columns: [t_dat, customer_join_idx, article_id]

split:
  train_weeks: [0, 9]
  val_week: 10
  test_week: 11

expected_rows:                  # fixture: no fixed counts (live-run mode)
  window: null
  after_dedup: null
  train: null
  val: null
  test: null

lists:
  evaluation_history_end_week: 9
  serving_history_end_week: 11

features:
  age_edges: [16, 20, 25, 30, 40, 50, 60, 100]

als:                            # fixture: tiny, trains in well under a second
  factors: 8
  iterations: 3
  regularization: 0.05
  alpha: 40
  random_state: 42
  filter_already_liked_items: false

recommend:
  k: 10
  repurchase_max: 10
  filler_candidates: 12         # fixture: only 15 articles exist (the real 30 needs at least 31 ALS columns)

gate:                           # fixture: permissive, see the header (plumbing, not quality)
  reference_recall: null
  reference_tolerance: 1.0e-6
  min_lift_over_popularity: 0.0
  cold_must_beat_popularity: false
